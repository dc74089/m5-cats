; M5Paper cat feeding tracker
;
; Platform is pinned to espressif32 6.x (Arduino core 2.0.17) on purpose:
; M5EPD is IDF-4 era and includes esp_adc_cal.h, which was removed in IDF 5,
; so Arduino core 3.x will not build it.
;
; The board definition is vendored in boards/m5paper.json because
; `m5stack-paper` ships only on platform-espressif32's develop branch, and its
; `variant: m5stack_paper` exists only in Arduino core 3.x.

[env:m5paper]
platform = espressif32@~6.10.0
board = m5paper
framework = arduino
upload_port = /dev/cu.usbserial-52D20506211
monitor_port = /dev/cu.usbserial-52D20506211
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    m5stack/M5EPD@^0.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags =
    -std=gnu++11
extra_scripts =
    pre:tools/build_timestamp.py
build_src_filter =
    +<*>

; Off-device unit tests for the pure display-ladder logic (src/schedule.cpp).
[env:native]
platform = native
test_framework = unity
; compile src/ into the test binary (schedule.cpp is the unit under test)
test_build_src = yes
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD
    -I include
    -I src
build_src_filter =
    +<schedule.cpp>
    +<battery.cpp>
